name: CodeQL

on:
  push:
    branches: [main]
  # Includes pull requests from forks. Keep the unprivileged PR event:
  # never replace this with pull_request_target when analyzing contributor code.
  pull_request:
  schedule:
    - cron: '23 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Do not consume potentially billable private-repository runner minutes.
    if: github.event.repository.visibility == 'public'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload analysis results; grants no code, tag, or release write access.
      # GitHub also permits CodeQL uploads for read-only fork PR runs.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - name: Check out the code being reviewed
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

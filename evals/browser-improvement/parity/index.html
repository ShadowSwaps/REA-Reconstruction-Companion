<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pocket Board</title>
<style>
body{margin:32px auto;padding:0 20px;max-width:900px;background:#f3f5f8;color:#17283a;font:16px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:28px}h2{font-size:21px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{border:1px solid #d2d9e2;border-radius:8px;padding:24px;background:#fff}button,input,select{font:inherit;padding:8px}button{cursor:pointer}label{display:block;margin:16px 0 8px}.rows{display:grid;gap:8px;margin-top:20px}.rows button{text-align:left}.rows [aria-pressed=true]{outline:3px solid #376ed1}input[type=text]{width:100%;box-sizing:border-box}[role=alert]{color:#a51919}[hidden]{display:none!important}
</style></head><body>
<header><h1>Pocket Board</h1><button id="add">New task</button></header><p role="status" id="notice">Ready</p><p role="alert" id="problem"></p>
<main class="columns"><section class="panel"><h2>Tasks</h2><label for="scope">Show</label><select id="scope"><option value="all">All</option><option value="open">Open</option><option value="done">Done</option></select><div class="rows" id="rows"></div></section>
<section class="panel"><h2>Editor</h2><p id="prompt">Select a task or create one.</p><form id="form" hidden novalidate><label for="name">Title</label><input type="text" id="name"><label><input id="complete" type="checkbox"> Done</label><p role="alert" id="invalid"></p><button type="submit">Save</button> <button type="button" id="abandon">Cancel</button></form></section></main><script src="app.js"></script></body></html>
